---
- name: Set sshd configuration options
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*{{ item.key }}\\b"
    line: "{{ item.key }} {{ item.value }}"
    state: present
    validate: "/usr/sbin/sshd -t -f %s"
  loop: "{{ cis_hardening_sshd_settings | dict2items }}"
  notify: Restart sshd

- name: Ensure sshd_config is owned by root and not world-readable
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
