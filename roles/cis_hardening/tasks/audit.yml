---
- name: Install auditd
  ansible.builtin.package:
    name: auditd
    state: present

- name: Deploy CIS audit rules
  ansible.builtin.template:
    src: cis.rules.j2
    dest: /etc/audit/rules.d/cis.rules
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd

- name: Ensure auditd is enabled and running
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
