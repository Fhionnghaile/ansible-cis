name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "14 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: pip install ansible-core ansible-lint yamllint
      - run: yamllint .
      - run: ansible-lint --offline
      - run: ansible-playbook --syntax-check -i inventory/hosts.ini playbooks/harden.yml playbooks/compliance.yml
